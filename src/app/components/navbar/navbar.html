<nav class="navbar">
  <div class="navbar-container">

    <a routerLink="/dashboard" class="navbar-logo">
      <div class="logo-icon">E</div>
      <div class="logo-text">
        <span class="logo-name">Erasmus+</span>
        <span class="logo-sub">Gestion des Mobilités</span>
      </div>
    </a>

    <div class="navbar-links">
      <a routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}">
        Tableau de Bord
      </a>
      <a routerLink="/candidatures"
         routerLinkActive="active">
        Candidatures
      </a>
      <a routerLink="/entretiens"
         routerLinkActive="active">
        Entretiens
      </a>
      <a routerLink="/decisions"
         routerLinkActive="active">
        Décisions
      </a>
    </div>

    <!-- Right side -->
    <div class="navbar-right">

      <!-- Notifications -->
      <button class="notif-btn">
        <svg width="19" height="19" fill="none" stroke="currentColor"
          stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge">{{ notifCount }}</span>
      </button>

      <!-- User menu -->
      <div class="user-wrapper">
        <button class="user-btn" (click)="toggleUserMenu()">
          <div class="user-avatar">
            <svg width="15" height="15" fill="none" stroke="#2563eb"
              stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="user-info">
            <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
            <span class="user-role">{{ getRoleLabel(user.role) }}</span>
          </div>
          <svg width="14" height="14" fill="none" stroke="#64748b"
            stroke-width="2" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="dropdown" *ngIf="showUserMenu">
          <button class="dropdown-item" (click)="closeUserMenu()">
            <svg width="15" height="15" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mon Profil
          </button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item danger" (click)="logout()">
            <svg width="15" height="15" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>

    </div>
  </div>
</nav>


<div class="overlay" *ngIf="showUserMenu" (click)="closeUserMenu()"></div>
